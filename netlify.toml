[build]
  publish = "."
  command = ""

# Pæne adresser uden .html
[[redirects]]
  from = "/arbejde"
  to = "/arbejde.html"
  status = 200
[[redirects]]
  from = "/ydelser"
  to = "/ydelser.html"
  status = 200
[[redirects]]
  from = "/priser"
  to = "/priser.html"
  status = 200
[[redirects]]
  from = "/om"
  to = "/om.html"
  status = 200
[[redirects]]
  from = "/kontakt"
  to = "/kontakt.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
